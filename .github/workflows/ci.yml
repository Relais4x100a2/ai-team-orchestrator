# ============================================================
# CI/CD pour l'orchestrateur AI Team
# ============================================================
# Ce workflow vérifie que l'orchestrateur compile correctement.
# Il ne lance PAS les agents (ça consomme des tokens).
#
# Pour le repo CIBLE (dataset_style), tu auras un workflow séparé
# qui peut éventuellement appeler l'orchestrateur pour reviewer les PRs.

name: CI — Orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Vérifie que le TypeScript compile sans erreur
      - run: npx tsc --noEmit

      # Vérifie que tous les prompts référencés par AGENT_CONFIG existent
      - run: npm run verify:prompts

      - run: npm run test:coverage

      - run: npm run coverage:gate
